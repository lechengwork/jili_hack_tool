syntax = "proto3";
package math_573;
// Game data from rcProto2; purchase fields from observed 573 requests/responses.

message Column {
  repeated int32 Col = 1;
  repeated uint32 _wire = 500000000;
}

message ColumnM {
  repeated double Col = 1;
  repeated uint32 _wire = 500000000;
}

message AwardData {
  int32 Atype = 1;
  int32 Index = 2;
  int32 Symbol = 3;
  int32 Pos = 4;
  double Mul = 5;
  double Win = 6;
  repeated uint32 _wire = 500000000;
}

message PotSymbol {
  int32 Pos = 1;
  int32 Symbol = 2;
  double Mul = 3;
  int32 ScatterMultiplier = 4;
  repeated uint32 _wire = 500000000;
}

message RoundInfo {
  repeated Column Symbol = 1;
  repeated ColumnM Mul = 2;
  repeated Column FinalSymbol = 3;
  repeated ColumnM FinalMul = 4;
  repeated AwardData AwardDataVec = 5;
  double RoundWin = 6;
  repeated PotSymbol PotList = 7;
  int32 BonusRemainRound = 8;
  int32 BonusTotalRound = 9;
  bool GetBonus = 10;
  int32 AwardTypeFlag = 11;
  bool MaxFlag = 12;
  int32 PlateChangeFlag = 13;
  repeated int32 ScatterMultiplier = 14;
  repeated uint32 _wire = 500000000;
}

message SpinAck {
  repeated RoundInfo RoundQueue = 1;
  double BonusTotalWin = 2;
  double TotalWin = 3;
  double RTP = 4;
  int32 LID = 5;
  int32 RID = 6;
  int32 AckType = 7;
  int32 Extra = 8;
  repeated uint32 _wire = 500000000;
}

message GameInfoData {
  bool ShowExtra = 1;
  repeated double Mul = 2;
  repeated uint32 _wire = 500000000;
}

message PurchaseOption {
  int32 f1 = 1;
  int32 selector = 2;
  double amount = 3;
  repeated uint32 _wire = 500000000;
}

message Bet {
  double bet = 1;
  PurchaseOption purchase = 23;
  repeated uint32 context = 25;
  repeated uint32 f26 = 26;
  repeated uint32 _wire = 500000000;
}

message Envelope {
  SpinAck data = 1;
  repeated uint32 service = 2;
  double totalWin = 3;
  double postMoney = 6;
  uint64 roundIndexV2 = 20;
  Bet spinReq = 23;
  repeated uint32 _wire = 500000000;
}
