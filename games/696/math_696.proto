syntax = "proto3";

// =============================================================================
// JILI 696 (迦樓羅戰神 500) — ★機率團隊介面★
//
// 這份是「給機率填的」proto,不是線路上跑的那份。
// 線路上那份是 fg5_696.proto:它有 bytes、有 reserved、有 proto3 省略規則、
// 有兩處互相鏡射的額外下注欄位 —— 那些是傳輸層的包裝,不該讓機率去背。
//
// 這份只留「有意義的格子」,而且全部是 int / double / enum,沒有 bytes。
// 機率吐這份 → 遊戲層用 math_adapter.py 轉成 fg5_696.proto 的 wire bytes → 加密發前端。
// 雙向且 byte 級可逆:834 局真實封包 round-trip 完全相同
// (`python3 math_adapter.py --selftest`,零相依,系統 python3 就能跑)。
//
// 696 只有額外下注,沒有免費遊戲。玩法 = 3×3 盤面連線 × 倍率轉輪。
// 依據:887 局真實伺服器對局 + 遊戲內說明頁/官方賠付表交叉比對。
// 欄位意義與實證細節見 games/696/math/INTERFACE.md。
// =============================================================================

package jili.math.v696;

option go_package = "jili/games/696/mathproto";


// ─── 額外下注 ────────────────────────────────────────────────────────────────
// 線路上這件事分散在兩個欄位(BetInfo.ante 的「有沒有出現」+ BoardDetail.ante_level
// 的「值要 +1」),這裡收斂成一個 enum,轉換由遊戲層負責。
enum Ante {
  ANTE_NONE = 0;   // 沒開額外下注 —— 實扣 = bet × 1
  ANTE_1_5X = 1;   // 1.5 倍       —— 實扣 = bet × 1.5(轉輪移除 1x/2x,保底 3x)
  ANTE_8X   = 2;   // 8 倍         —— 實扣 = bet × 8  (再移除 3x/5x/10x,保底 15x)
}


// ─── 輸入:遊戲層 → 機率 ─────────────────────────────────────────────────────
message SpinRequest {

  // 基礎注(玩家在押注面板選的值)。可選:0.1 0.2 0.3 0.5 0.8 1 2 5 10 20 30 40 50 70 100
  // ★實扣不等於這個值★ —— 要依 ante 乘 1 / 1.5 / 8。算 RTP 一定要用實扣。
  double bet = 1;

  Ante ante = 2;
}


// ─── 輸出:機率 → 遊戲層 ★機率只要填這個★ ────────────────────────────────────
message SpinResult {

  Board board = 1;

  // 該局總贏分 = sum(board.line_wins[].win_cash)
  double total_win = 2;

  // 結算後餘額 —— ☆遊戲層回填,機率留 0 即可☆
  double balance = 3;

  // 19 碼局號(尾三碼固定 696)—— ☆遊戲層回填,機率留空即可☆
  string round_id = 4;

  // 該局基礎注(鏡射 SpinRequest.bet)
  double base_bet = 5;

  // 鏡射 SpinRequest.ante
  Ante ante = 6;
}


message Board {

  // 主盤面,固定 3 軸 × 每軸 3 格。
  repeated Reel reels = 1;

  // ★倍率轉輪★ 就是遊戲畫面右邊那條。平常 5 格 = 玩家看得到的 5 個位置。
  //
  //   符號 id → 倍率(說明書:共 11 種,最高 500x;剛好對上 id 9–19)
  //     9=1x  10=2x  11=3x  12=5x  13=10x  14=15x  15=20x  16=25x  17=50x
  //     18=100x  19=500x
  //     20 = Ex NUDGE 推動符號(不是倍率,加總時計為 0)
  //
  //   window[2](正中間那格)= 這局選中的倍率。
  //   (5 個位置全試過,只有 index 2 零衝突;其餘 4 格各有 8–9 個符號對到多種倍率)
  //
  //   ⚠ window 算出來的倍率必須等於下面的 multiplier,否則前端轉輪會跟派彩對不上。
  repeated int32 window = 2;

  // 中獎線;沒中就空陣列。
  repeated LineWin line_wins = 3;

  // 中獎類型(887 局零例外):0=沒中獎、1=一般中獎、3=Ex Nudge 局中獎。
  //   ★不是線數、也不是符號種類數★(有局 5 條線是 1、有局 3 條線是 3)
  //   ☆機率可以不填,遊戲層會依 line_wins 與 window 長度自動補☆
  int32 win_type = 4;

  // ★★倍率算法 —— 一般局 / Ex Nudge / 連鎖 全部同一條規則(887 局零反例)★★
  //
  //       multiplier = sum(window[2 .. len(window)-3])
  //
  //   白話:視窗永遠是【中間格上面 2 格 + 抓取區間 + 下面 2 格】,中間那段加總就是答案。
  //   沒觸發時 len(window)=5 → 只剩 window[2] 一格,自動退化成一般局。
  //   加總時【符號 20 計為 0】(它是推動符號,不是倍率)。
  //
  //   ⚠ 不要用 window_extra 去算 —— 連鎖觸發時它只記第一段(見 nudge_group=3)。
  //   ★已乘進 line_wins[].win_cash,不要再乘一次★
  double multiplier = 5;

  // 887 局恆 0.97。
  double rtp_const = 6;

  // ── Ex Nudge(說明書的「向下抓取相應數量的倍率」)──────────────────────────
  //
  //   len(window) = 5 + window_extra + window_extra2
  //
  //   說明書的抓取次數可能值(實測 13 種全部見過,與清單一字不差):
  //     一般          2, 3, 4, 5, 8, 10, 15, 20, 25, 50
  //     額外下注 1.5x  再加 100, 200, 500
  //     額外下注 8x    5, 8, 10, 15, 20, 25, 50, 100, 200, 500
  //
  //   ⚠ 說明書寫「且當局有中獎」才觸發,但 30 局 Ex Nudge 裡多數沒中獎。以封包為準。

  // 第一段的抓取次數。
  int32 window_extra = 7;

  // 連鎖第二段的抓取次數(往下抓時又撞到轉輪上的 Ex NUDGE 格)。沒連鎖時 0。
  int32 window_extra2 = 11;

  // 觸發源。★不影響倍率計算★,純資訊欄位。
  //   0 = 沒觸發
  //   1 = 盤面(符號 8,出現在第 1/2/3 軸)
  //   2 = 倍率轉輪(符號 20,★只有落在中間格才觸發★)
  //   3 = 連鎖(盤面先觸發,往下抓時又撞到轉輪的 Ex NUDGE,再多抓一段)
  int32 nudge_group = 8;

  // 固定 4 組:前 3 組各 3 格(對應盤面 3 軸)、第 4 組 5 格(對應倍率轉輪)。
  //   ★記錄「Ex Nudge 符號所在位置 + 它上面寫的次數」—— 不管有沒有觸發都會記★
  //   (498 局零反例:轉輪可見格有符號 20 ⇔ 第 4 組在該位置有非零值)
  repeated Nudge post_nudge = 10;

  // ── 迦樓羅的饋贈(隨機觸發的加成功能)──────────────────────────────────────
  // ★說明頁:「觸發後可能出現以下【一種或多種】效果」——nudge_pos 可以同時多格非零。
  //   1699 局真封包每次都只中一種,但規則上允許組合,別把它當單選。
  // ☆這兩格機率照抄即可,不必自己產生饋贈。☆

  // 【5 格效果槽】,不是位置:哪一格非零 = 觸發哪個效果,該格的值 = 該效果的參數。
  //   index 0  值恆 1     ①「挑 3~5 個倍率符號,顯著提高它們出現的概率」
  //                       ★伴隨欄位 = gift_pool(f9),不是 boost_symbols★
  //                       2 局實證:f9 各 3 個符號,轉輪 5 格 5/5 全部從中抽出。
  //                       ★只在 1.5x 抓到;8x 跑 1398 局零次★
  //   index 1  值 = 被替換掉的原符號 id   「把最終結果替換為所選符號」
  //   index 2  值恆 1     ③「把最終倍率符號升級為更高的數值」★與 boost_symbols 完全綁定★
  //                       boost_symbols = 升級候選(2~3 個),6/6 局最終中間格都在清單內
  //   index 3  值 = 1..4  ★「交換」不是「升階」★:把中間格跟轉輪另一格對調
  //                       1→idx0、2→idx1、3→idx3、4→idx4(不含中間格自己)
  //   index 4  值 = 1..3  「重轉一軸」★★目前前端會卡死,先不要產生★★
  //                       (缺一個描述「重轉前轉軸」的伴隨欄位,還沒找到)
  repeated int32 nudge_pos = 9;

  // 饋贈①被「提高出現機率」的轉輪符號。沒觸發時空陣列。
  //   實例:[15,16,18]=20x/25x/100x(該局轉輪命中 3/5)、[17,18]=50x/100x(命中 2/5)
  //   對照全體平均 33.7%。
  //   ⚠ 說明書寫「3~5 個」,但實測有一局只有 2 個 —— 長度別寫死。
  // 饋贈①(index0)挑中的 3~5 個倍率符號。沒觸發時空陣列。★2026-09-21 新增★
  repeated int32 gift_pool = 9;

  // 饋贈④(index4 重轉一軸):被重轉那一軸【重轉前】的 3 個符號。沒觸發時空陣列。
  //   nudge_pos[4] 的值 = 重轉第幾軸(1..3)。★前端演動畫一定要這個欄位★
  repeated int32 respin_prev = 11;

  repeated int32 boost_symbols = 12;
}


message Reel {

  // 3 個符號 id,由上到下:
  //   0=J(賠 1)  1=Q(2.5)  2=K(4)  3=A(5)
  //   4=綠寶石(6)  5=藍寶石(7.5)  6=紅寶石(10)
  //   7 = ★WILD 百搭★       賠 25;可出現在所有轉軸,替代任意符號
  //   8 = ★Ex NUDGE 百搭★   賠 25;只在第 1/2/3 軸,同時是百搭 + Ex Nudge 觸發源
  //
  //   7/8 中獎時記在【被替代的符號】上,不會以 symbol_id=7/8 出現在 line_wins。
  repeated int32 symbols = 1;
}


message Nudge {

  // 平常全 0。
  //   盤面那 3 組:Ex Nudge 百搭(符號 8)所在格,填入它上面寫的次數。
  //   轉輪那組  :Ex Nudge(符號 20)所在格,填入它的次數(不管有沒有觸發)。
  //
  // ⚠ 次數可以到 500。線路上這些陣列是 packed varint,遊戲層會處理編碼,
  //   機率直接填整數即可。
  repeated int32 cells = 1;
}


// 一條中獎線。每條線只計最高獎。
//
//   ★公式(230 條中獎線 100% 吻合,跨注額 0.1 / 0.3 / 5 / 10 完全線性)★
//
//       win_cash = base_bet × payrate[symbol_id] × multiplier / 5
//
//       payrate = { J:1, Q:2.5, K:4, A:5, 綠寶石:6, 藍寶石:7.5, 紅寶石:10,
//                   WILD:25, Ex NUDGE 百搭:25 }
//
//   與說明書規則 5「獎金 = 賠付 × 特殊轉軸倍率 / 5」是同一條式子。
//   `5` = 支付線數。win_cash 已含 multiplier。
message LineWin {

  // 中獎符號(WILD 替代時記被替代的那個)。
  int32 symbol_id = 1;

  // 3 軸機台,實測恆為 3。
  int32 match_count = 2;

  // 0–4,共 5 條支付線。每條線在三個轉輪各取哪一列
  // (★由 230 條中獎線反解,每條都是唯一解,且「該中卻沒判中」0 條★):
  //   0 = 中排              1 = 上排              2 = 下排
  //   3 = 左上 → 右下 斜線   4 = 左下 → 右上 斜線
  //
  //   ⚠ 注意 0 是【中排】不是上排。
  int32 payline_index = 3;

  double win_cash = 4;
}
