syntax = "proto3";
package jili.math.v807;
// Numeric math interface; field names ending fN intentionally retain uncertain semantics.
message PackedValues { repeated int32 values=1; }
message Column {
  repeated int32 values = 1;
}
message SymbolCount {
  int32 symbol_id = 1;
  int32 count = 2;
}
message LineWin {
  int32 symbol_id = 1;
  int32 match_count = 2;
  int32 payline_index = 3;
  double win_cash = 4;
}
message SpinAck {
  repeated Column reels = 1;
  repeated Column nudge_marks = 2;
  Column multiplier_reel = 3;
  int32 extra_steps = 4;
  repeated int32 extra_step_chain = 5;
  repeated SymbolCount effect_symbols_f6 = 6;
  repeated SymbolCount effect_symbols_f7 = 7;
  repeated int32 effect_indices_f8 = 8;
  repeated EffectContext effect_context_f9 = 9;
  repeated LineWin line_wins = 11;
  int32 win_type = 12;
  repeated int32 effect_slots_f13 = 13;
  repeated int32 gift_pool_f14 = 14;
  repeated int32 upgrade_symbols_f15 = 15;
  repeated int32 respin_previous_reel_f16 = 16;
  repeated int32 effect_slots_f17 = 17;
  int32 multiplier = 18;
  double total_win = 19;
  double config_value_f21 = 21;
  int32 ante_mode = 22;
}
message EffectContext {
}
message Ante { int32 level=1; }
message Special { Ante ante=1; }
message SpinRequest { double bet=1; Special special=2; }
message Service {}
message SpinResult { SpinAck data=1; Service service=2; double postMoney=3; string roundIndexV2=4; SpinRequest spinReq=5; }
